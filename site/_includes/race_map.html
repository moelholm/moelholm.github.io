{% assign map_races = site.running | where_exp: "post", "post.tags contains 'race'" | sort: "date" | reverse %}
<section class="race-map{% if include.size == 'large' %} race-map--large{% endif %}" data-race-map>
  {% if include.filters %}
  <div class="race-map__filters" aria-label="Filter races">
    <label>Search <input type="search" data-filter="search" placeholder="Race or city"></label>
    <label>Year <select data-filter="year"><option value="">All years</option></select></label>
    <label>Country <select data-filter="country"><option value="">All countries</option></select></label>
    <label>Type <select data-filter="type"><option value="">All types</option></select></label>
  </div>
  {% endif %}
  <div class="race-map__summary" data-map-summary aria-live="polite"></div>
  <div class="race-map__canvas" data-map-canvas role="region" aria-label="Interactive map of race locations"></div>
  <div class="race-map__legend" aria-label="Race type legend">
    <span><i class="race-map__swatch race-map__swatch--trail"></i>Trail</span>
    <span><i class="race-map__swatch race-map__swatch--ultra"></i>Ultra</span>
    <span><i class="race-map__swatch race-map__swatch--road"></i>Road</span>
    <span><i class="race-map__swatch race-map__swatch--backyard"></i>Backyard</span>
  </div>
  {% if include.list %}
  <div class="race-map__results" data-map-results aria-live="polite"></div>
  {% endif %}
  <script type="application/json" data-race-map-data>[
    {% assign first_race = true %}
    {% for post in map_races %}
      {% assign race_date = post.race_date | default: post.date %}
      {% assign race_year = race_date | date: "%Y" %}
      {% if post.race_location and post.race_country and post.race_latitude and post.race_longitude %}
        {% if include.year == nil or include.year == race_year %}
          {% unless first_race %},{% endunless %}
          {
            "title": {{ post.title | jsonify }},
            "url": {{ post.url | jsonify }},
            "date": {{ race_date | date: "%Y-%m-%d" | jsonify }},
            "year": {{ race_year | jsonify }},
            "location": {{ post.race_location | jsonify }},
            "country": {{ post.race_country | jsonify }},
            "latitude": {{ post.race_latitude | jsonify }},
            "longitude": {{ post.race_longitude | jsonify }},
            "distance": {{ post.distance_km | default: "" | jsonify }},
            "elevation": {{ post.elevation_gain_m | default: "" | jsonify }},
            "duration": {{ post.duration_formatted | default: "" | jsonify }},
            "race_website": {{ post.race_website | default: "" | jsonify }},
            "results_url": {{ post.race_results_official | default: "" | jsonify }},
            "tags": {{ post.tags | jsonify }}
          }
          {% assign first_race = false %}
        {% endif %}
      {% endif %}
    {% endfor %}
  ]</script>
</section>
