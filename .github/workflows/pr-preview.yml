name: PR Preview (Netlify)

on:
  pull_request:
    branches: [ master ]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  deployments: write

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: false

      - name: Install Jekyll dependencies
        run: |
          cd site
          bundle install

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache npm packages
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-netlify-cli-v1
          restore-keys: |
            ${{ runner.os }}-npm-netlify-cli-
      
      - name: Build Jekyll site with drafts and future posts
        run: |
          cd site
          bundle exec jekyll build --drafts --future
        env:
          JEKYLL_ENV: preview
      
      - name: Install Netlify CLI
        run: npm install -g netlify-cli --prefer-offline --no-audit --no-fund
      
      - name: Deploy to Netlify
        id: netlify-deploy
        run: |
          netlify deploy \
            --dir=site/_site \
            --site=${{ secrets.NETLIFY_SITE_ID }} \
            --auth=${{ secrets.NETLIFY_AUTH_TOKEN }} \
            --alias=pr-${{ github.event.pull_request.number }} \
            --message="PR #${{ github.event.pull_request.number }} - ${{ github.event.pull_request.title }}" \
            --json > deploy-output.json
          
          echo "deploy-url=$(jq -r '.deploy_url' deploy-output.json)" >> $GITHUB_OUTPUT
        timeout-minutes: 5
      
      - name: Comment PR with preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const deployUrl = '${{ steps.netlify-deploy.outputs.deploy-url }}';
            const comment = `
            ### 🚀 Netlify Preview Deployment
            
            ✅ Preview URL: ${deployUrl}
            
            📝 PR #${{ github.event.pull_request.number }} - ${{ github.event.pull_request.title }}
            `;
            
            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(c => 
              c.user.type === 'Bot' && c.body.includes('Netlify Preview Deployment')
            );
            
            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            }

